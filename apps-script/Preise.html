<!DOCTYPE html>
<!--
  Ladeplanung — Seite „Ladepreise": zeigt preise.json und holt neue Werte über OpenRouter (mit Websuche).
  Übernommen wird erst nach Bestätigung. Wird von doGet() in Code.js ausgeliefert (…/exec?seite=preise).
  Version 0.20.0 — Übersicht nach der Suche (bestätigt / neuer Preis / unsicher mit Grund), Speichern setzt den Stand
                   immer auf heute (= zuletzt geprüft).
  Version 0.19.0 — Auf dem Handy nicht mehr winzig: hochskalieren, wenn die Seite in Desktop-Breite erscheint.
  Version 0.18.1 — kleiner, Tarife in zwei Spalten, Link zur Android-App, „auch" (Porsche → AMAG).
  Version 0.18.0
-->
<html lang="de">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --grund: #ffffff; --flaeche: #f2f2f2; --text: #000000; --leise: #3d3d3d; --linie: #c8c8c8;
      --akzent: #9a4a00; --akzent-text: #ffffff; --fehler: #7a0000; --gut: #1d6b1d;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --grund: #000000; --flaeche: #161616; --text: #ffffff; --leise: #c4c4c4; --linie: #3a3a3a;
        --akzent: #ffac4a; --akzent-text: #000000; --fehler: #ffb4b4; --gut: #8fdc8f;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--grund); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 620px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 22px; margin: 4px 0 4px; }
    h2 { font-size: 17px; margin: 16px 0 6px; }
    p { margin: 0 0 8px; }
    .leise { color: var(--leise); overflow-wrap: anywhere; }
    .karte { border: 1px solid var(--linie); border-radius: 10px; padding: 6px 10px; margin-bottom: 8px; }
    .kopf { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .kopf a { color: var(--akzent); font-weight: 600; text-decoration: none; white-space: nowrap; }
    .tarife { display: grid; grid-template-columns: max-content 1fr; column-gap: 12px; row-gap: 1px; margin: 2px 0; font-variant-numeric: tabular-nums; }
    .tname { white-space: nowrap; color: var(--leise); }
    .neu { color: var(--gut); font-weight: 700; }
    .fehler { color: var(--fehler); font-weight: 700; }
    label.wahl { display: flex; gap: 10px; align-items: center; margin-top: 6px; font-weight: 700; }
    label.wahl input { width: 24px; height: 24px; }
    .knopf {
      display: flex; align-items: center; justify-content: center; width: 100%; min-height: 46px; margin-top: 8px;
      border-radius: 10px; border: 2px solid var(--linie); background: var(--flaeche); color: var(--text);
      font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; text-align: center; padding: 0 12px;
    }
    .knopf.haupt { background: var(--akzent); border-color: var(--akzent); color: var(--akzent-text); }
    .knopf:disabled { opacity: .6; }
    #meldung { white-space: pre-wrap; }
    .summe { font-weight: 700; font-size: 16px; margin: 8px 0; }
    .zeile { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .zeichen { font-weight: 700; white-space: nowrap; }
    .zeichen.ok { color: var(--gut); }
    .zeichen.neu { color: var(--akzent); }
    .zeichen.unsicher, .zeichen.fehler { color: var(--fehler); }
    .alt { color: var(--leise); }
  </style>
  <script>
    // Auf dem Handy erscheint die Seite teils in Desktop-Breite und damit winzig (03.10.2026) → auf Gerätebreite hochskalieren
    (function () {
      var breite = window.innerWidth, geraet = screen.width;
      if (geraet && geraet < 600 && breite > geraet * 1.15) document.documentElement.style.zoom = String(Math.min(3, breite / geraet));
    })();
  </script>
</head>
<body>
  <main>
    <h1>Ladepreise</h1>
    <p class="leise" id="stand"></p>
    <div id="liste"></div>

    <h2>Aktualisieren</h2>
    <p class="leise">Sucht für jeden Anbieter die aktuellen Direktpreise im Netz (Sprachmodell über OpenRouter mit Google-Suche, ca. 10 Cent je Durchgang).</p>
    <button id="holen" class="knopf haupt">Neue Preise suchen (ca. 1 Minute)</button>
    <p id="meldung" class="leise"></p>
    <p id="zusammenfassung" class="summe" hidden></p>
    <div id="vorschlaege"></div>
    <p id="speichern-hinweis" class="leise" hidden>Speichern übernimmt die angekreuzten neuen Preise und setzt den Stand auf heute – auch wenn sich nichts geändert hat.</p>
    <button id="speichern" class="knopf haupt" hidden>Speichern (Stand heute)</button>

    <a id="zur-app" class="knopf" href="#">Zur App</a>
    <p id="version" class="leise"></p>
  </main>

  <script>
    'use strict';
    const MODELL = <?!= modellJson ?>;
    const $ = id => document.getElementById(id);
    const LAND = { CH: 'Schweiz', DE: 'Deutschland', AT: 'Österreich', IT: 'Italien' };
    let aktuell = MODELL.preise || { anbieter: [] };
    let vorschlaege = [];

    $('zur-app').href = MODELL.appUrl;
    $('version').textContent = 'Apps Script v' + MODELL.version;

    const zahl = x => x.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const geld = (x, w) => zahl(x) + ' ' + (w === 'EUR' ? '€' : w);
    function tarifText(t, w) {
      let s = (t.kwh_bis ? zahl(t.kwh) + '–' + geld(t.kwh_bis, w) : geld(t.kwh, w)) + '/kWh';
      if (t.minute) s += ' + ' + geld(t.minute, w) + '/min';
      if (t.grund_monat) s += ' · ' + geld(t.grund_monat, w) + '/Monat';
      return s;
    }
    function datum(iso) { const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3] + '.' + m[2] + '.' + m[1] : '–'; }
    function el(tag, klasse, text) { const e = document.createElement(tag); if (klasse) e.className = klasse; if (text !== undefined) e.textContent = text; return e; }

    function tarifBlock(tarife, w, klasse) {
      if (!tarife.length) return el('div', 'leise', 'kein Preis hinterlegt');
      const box = el('div', 'tarife ' + (klasse || ''));
      for (const t of tarife) box.append(el('span', 'tname', t.name), el('span', '', tarifText(t, w)));
      return box;
    }
    function kopf(a, text) {
      const k = el('div', 'kopf');
      k.append(el('b', '', text));
      if (a.app) { const l = el('a', '', 'App ' + a.app.name + ' ›'); l.href = a.app.url; l.target = '_blank'; l.rel = 'noopener'; k.append(l); }
      return k;
    }

    function zeige() {
      $('stand').textContent = 'Stand ' + datum(aktuell.stand) + ' · nur Direktangebote, kein Roaming';
      const liste = $('liste');
      liste.replaceChildren();
      for (const land of ['CH', 'DE', 'AT', 'IT']) {
        const eintraege = aktuell.anbieter.filter(a => a.land === land);
        if (!eintraege.length) continue;
        liste.append(el('h2', '', LAND[land]));
        for (const a of eintraege) {
          const k = el('div', 'karte');
          k.append(kopf(a, a.betreiber + (a.auch && a.auch.length ? ' / ' + a.auch.join(', ') : '')), tarifBlock(a.tarife, a.waehrung));
          if (a.hinweis) k.append(el('p', 'leise', a.hinweis));
          liste.append(k);
        }
      }
    }

    // Je Anbieter ein Ergebnis: ✓ bestätigt (unverändert), ✎ neuer Preis, ? unsicher (mit Grund), ⚠ keine Antwort
    function art(v) {
      if (v.fehler) return 'fehler';
      if (!v.neu.sicher) return 'unsicher';
      return JSON.stringify(v.neu.tarife) === JSON.stringify(v.alt.tarife) ? 'ok' : 'neu';
    }
    const ZEICHEN = { ok: '✓ bestätigt', neu: '✎ neuer Preis', unsicher: '? unsicher', fehler: '⚠ keine Antwort' };
    const REIHE = { neu: 0, unsicher: 1, fehler: 2, ok: 3 };

    function quelleLink(url) {
      const q = el('a', 'leise', 'Quelle ›'); q.href = url; q.target = '_blank'; q.rel = 'noopener';
      return q;
    }

    function zeigeVorschlaege() {
      const box = $('vorschlaege');
      box.replaceChildren();
      const zahl = { ok: 0, neu: 0, unsicher: 0, fehler: 0 };
      vorschlaege.forEach(v => zahl[art(v)]++);
      const teile = [zahl.ok + ' bestätigt', zahl.neu + ' mit neuem Preis', zahl.unsicher + ' unsicher'];
      if (zahl.fehler) teile.push(zahl.fehler + ' ohne Antwort');
      $('zusammenfassung').textContent = vorschlaege.length + ' Anbieter: ' + teile.join(', ');
      $('zusammenfassung').hidden = false;

      const reihenfolge = vorschlaege.map((v, i) => i).sort((x, y) => REIHE[art(vorschlaege[x])] - REIHE[art(vorschlaege[y])]);
      for (const i of reihenfolge) {
        const v = vorschlaege[i], a = v.alt, typ = art(v);
        const k = el('div', 'karte');
        const z = el('div', 'zeile');
        z.append(el('b', '', a.betreiber + ' · ' + (LAND[a.land] || a.land)), el('span', 'zeichen ' + typ, ZEICHEN[typ]));
        k.append(z);
        if (typ === 'fehler') { k.append(el('p', 'leise', v.fehler)); box.append(k); continue; }
        if (typ === 'ok') {
          k.append(tarifBlock(a.tarife, a.waehrung));
        } else {
          const gleich = JSON.stringify(v.neu.tarife) === JSON.stringify(a.tarife);
          if (typ === 'unsicher') k.append(el('p', 'fehler', v.neu.grund || 'keine verlässliche aktuelle Quelle gefunden'));
          k.append(el('p', 'leise', gleich ? 'bisher (bleibt):' : 'bisher:'), tarifBlock(a.tarife, a.waehrung, 'alt'));
          if (!gleich) {
            k.append(el('p', 'leise', typ === 'unsicher' ? 'gefunden (nicht sicher):' : 'neu:'), tarifBlock(v.neu.tarife, a.waehrung, 'neu'));
            const l = el('label', 'wahl');
            const c = el('input'); c.type = 'checkbox'; c.checked = typ === 'neu'; c.dataset.i = i;
            l.append(c, 'neuen Preis übernehmen');
            k.append(l);
          }
        }
        if (v.neu.hinweis && typ !== 'ok') k.append(el('p', 'leise', v.neu.hinweis));
        if (v.neu.quelle) k.append(quelleLink(v.neu.quelle));
        box.append(k);
      }
      $('speichern').hidden = $('speichern-hinweis').hidden = false;
    }

    $('holen').addEventListener('click', () => {
      if (!MODELL.schluessel) { $('meldung').textContent = '⚠ Der OpenRouter-Schlüssel ist noch nicht im Script hinterlegt.'; return; }
      $('holen').disabled = true;
      $('meldung').textContent = 'Suche läuft … bitte warten.';
      $('vorschlaege').replaceChildren();
      $('speichern').hidden = $('speichern-hinweis').hidden = $('zusammenfassung').hidden = true;
      google.script.run
        .withSuccessHandler(erg => {
          $('holen').disabled = false;
          if (!erg.ok) { $('meldung').textContent = '⚠ ' + erg.text; return; }
          vorschlaege = erg.vorschlaege;
          $('meldung').textContent = 'Fertig (Modell ' + erg.modell + (erg.suche ? ', ' + erg.suche : '') + ').';
          zeigeVorschlaege();
        })
        .withFailureHandler(f => { $('holen').disabled = false; $('meldung').textContent = 'Fehler: ' + ((f && f.message) || f); })
        .preiseVorschlagen();
    });

    $('speichern').addEventListener('click', () => {
      // Auch ohne Änderung speichern: der Stand heißt dann „zuletzt geprüft" (Christof, 16.10.2026)
      const gewaehlt = new Set([...document.querySelectorAll('#vorschlaege input:checked')].map(c => Number(c.dataset.i)));
      const neu = aktuell.anbieter.map((a, i) => {
        const v = vorschlaege[i];
        if (!gewaehlt.has(i) || !v || v.fehler) return a;
        return Object.assign({}, a, { tarife: v.neu.tarife, hinweis: v.neu.hinweis || a.hinweis });
      });
      $('speichern').disabled = true;
      google.script.run
        .withSuccessHandler(erg => {
          $('speichern').disabled = false;
          $('meldung').textContent = erg.ok ? '✓ ' + (gewaehlt.size ? gewaehlt.size + ' Anbieter mit neuem Preis, ' : 'Preise unverändert, ') + 'Stand ' + datum(erg.preise.stand) + '. ' + erg.text : '⚠ ' + erg.text;
          if (erg.ok) {
            aktuell = erg.preise; vorschlaege = []; zeige(); $('vorschlaege').replaceChildren();
            $('speichern').hidden = $('speichern-hinweis').hidden = $('zusammenfassung').hidden = true;
          }
        })
        .withFailureHandler(f => { $('speichern').disabled = false; $('meldung').textContent = 'Fehler: ' + ((f && f.message) || f); })
        .preiseSpeichern(neu);
    });

    zeige();
  </script>
</body>
</html>
