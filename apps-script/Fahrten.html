<!DOCTYPE html>
<!--
  Ladeplanung — Meine Fahrten. Wird von doGet() mit ?seite=fahrten ausgeliefert (nur Christofs Google-Konto).
  Version 0.1.0 (22.10.2026, Christof: „schnell sehen in einer Übersicht, wie lange so eine Fahrt dauert – Fahren + Laden +
  Pause + Stau", gut lesbar auf dem Handy): je Ziel Ø Unterwegs als große Zahl mit einem Balken aus den Anteilen, darunter
  die einzelnen Fahrten aufklappbar. Daten aus dem Blatt „Reisen" (reisenGruppen_ in Code.js).
-->
<html lang="de">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --grund: #ffffff; --flaeche: #f2f2f2; --text: #000000; --leise: #3d3d3d; --linie: #c8c8c8;
      --akzent: #9a4a00; --akzent-text: #ffffff;
      --fahren: #1f7a3f; --stau: #b3261e; --laden: #b35c00; --pause: #8a6d00; --sonst: #8a8a8a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --grund: #000000; --flaeche: #161616; --text: #ffffff; --leise: #c4c4c4; --linie: #3a3a3a;
        --akzent: #ffac4a; --akzent-text: #000000;
        --fahren: #5ee38b; --stau: #ff6b6b; --laden: #ffac4a; --pause: #ffd166; --sonst: #9a9a9a;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--grund); color: var(--text); font: 17px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 24px; margin: 4px 0 6px; }
    .leise { color: var(--leise); margin: 0 0 12px; }
    .gruppe { border: 1px solid var(--linie); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; background: var(--flaeche); }
    .gruppe h2 { font-size: 19px; margin: 0; }
    .gross { font-size: 40px; font-weight: 800; line-height: 1.1; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
    .unter { color: var(--leise); font-size: 15px; }
    .balken { display: flex; height: 16px; border-radius: 8px; overflow: hidden; margin: 10px 0 8px; background: var(--linie); }
    .balken span { display: block; height: 100%; }
    .anteile { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 8px; align-items: center; font-variant-numeric: tabular-nums; }
    .anteile i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
    .anteile b { text-align: right; }
    details { margin-top: 10px; }
    summary { cursor: pointer; font-weight: 700; min-height: 40px; display: flex; align-items: center; }
    .fahrt { border-top: 1px solid var(--linie); padding: 10px 0 4px; }
    .fahrt .kopf { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; }
    .fahrt .zeile { color: var(--leise); font-size: 15px; }
    .fahrt details { margin-top: 4px; }
    .fahrt summary { min-height: 32px; font-weight: 600; font-size: 15px; color: var(--leise); }
    .knopf {
      display: flex; align-items: center; justify-content: center; width: 100%; min-height: 54px; margin-top: 10px;
      border-radius: 10px; border: 2px solid var(--linie); background: var(--flaeche); color: var(--text);
      font: inherit; font-weight: 700; text-decoration: none; text-align: center; padding: 0 12px;
    }
  </style>
  <script>
    // Auf dem Handy erscheint die Seite teils in Desktop-Breite und damit winzig (03.10.2026) → auf Gerätebreite hochskalieren
    (function () {
      var breite = window.innerWidth, geraet = screen.width;
      if (geraet && geraet < 600 && breite > geraet * 1.15) document.documentElement.style.zoom = String(Math.min(3, breite / geraet));
    })();
  </script>
</head>
<body>
  <main>
    <h1>Meine Fahrten</h1>
    <p class="leise" id="einleitung"></p>
    <div id="gruppen"></div>
    <a id="zur-app" class="knopf" href="#">Zur App</a>
    <p id="version" class="leise"></p>
  </main>

  <script>
    'use strict';
    const MODELL = <?!= modellJson ?>;
    const $ = id => document.getElementById(id);
    const el = (tag, klasse, text) => { const e = document.createElement(tag); if (klasse) e.className = klasse; if (text !== undefined) e.textContent = text; return e; };
    const dauer = min => { const m = Math.max(0, Math.round(min)); return m >= 60 ? Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0') : m + ' min'; };
    const datum = iso => new Date(iso).toLocaleDateString('de-CH', { weekday: 'short', day: '2-digit', month: '2-digit', year: '2-digit' });
    const uhr = iso => new Date(iso).toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' });
    const zahl = (x, n) => Number(x).toLocaleString('de-DE', { maximumFractionDigits: n || 0 });
    $('zur-app').href = MODELL.appUrl;
    $('version').textContent = 'Apps Script v' + MODELL.version;

    const TEILE = [['fahren', 'Fahren', '--fahren'], ['stau', 'Stau', '--stau'], ['laden', 'Laden', '--laden'], ['pausen', 'Pausen', '--pause'], ['sonst', 'Halte, sonstiges', '--sonst']];

    /** Balken und Liste der Anteile (Fahren ohne Stau, Stau, Laden, Pausen, Rest). */
    function anteile(box, w) {
      const summe = TEILE.reduce((s, t) => s + (w[t[0]] || 0), 0) || 1;
      const balken = el('div', 'balken');
      for (const [k, , farbe] of TEILE) if (w[k] >= 1) { const s = el('span'); s.style.width = (w[k] / summe * 100) + '%'; s.style.background = 'var(' + farbe + ')'; balken.append(s); }
      const liste = el('div', 'anteile');
      for (const [k, name, farbe] of TEILE) {
        if (!(w[k] >= 1) && k === 'sonst') continue;
        const i = el('i'); i.style.background = 'var(' + farbe + ')';
        liste.append(i, el('span', '', name), el('b', '', dauer(w[k] || 0)));
      }
      box.append(balken, liste);
    }

    const gruppen = MODELL.gruppen || [];
    const anzahl = gruppen.reduce((s, g) => s + g.anzahl, 0);
    $('einleitung').textContent = anzahl
      ? anzahl + (anzahl === 1 ? ' Fahrt' : ' Fahrten') + ' aus dem Blatt „Reisen" (gespeichert über „Fahrt auswerten" oder „Fahrt speichern"). Werte je Ziel im Durchschnitt.'
      : 'Noch keine Fahrt gespeichert – nach einer Fahrt in der App „Fahrt auswerten" (GPX) oder „Fahrt speichern".';

    for (const g of gruppen) {
      const k = el('section', 'gruppe');
      k.append(el('h2', '', 'nach ' + g.nach + ' · ' + g.anzahl + (g.anzahl === 1 ? ' Fahrt' : ' Fahrten')));
      k.append(el('div', 'gross', dauer(g.unterwegs)));
      k.append(el('div', 'unter', 'unterwegs im Schnitt · ' + zahl(g.km) + ' km' + (g.faktor ? ' · Fahren mit Stau ≈ Routendienst × ' + zahl(g.faktor, 2) : '')));
      anteile(k, g);
      const klappe = el('details');
      klappe.append(el('summary', '', 'Einzelne Fahrten (' + g.anzahl + ')'));
      for (const f of g.fahrten) {
        const z = el('div', 'fahrt');
        const kopf = el('div', 'kopf');
        kopf.append(el('span', '', datum(f.start) + ' · ' + f.von + ' → ' + f.nach), el('span', '', dauer(f.unterwegs)));
        z.append(kopf, el('div', 'zeile', uhr(f.start) + '–' + uhr(f.ende) + ' · ' + zahl(f.km) + ' km' + (f.quelle ? ' · ' + f.quelle : '')));
        anteile(z, f);
        const mehr = el('details');
        mehr.append(el('summary', '', 'Laden und Verbrauch'));
        const zeilen = [
          f.ladestopps ? f.ladestopps + ' Ladestopp' + (f.ladestopps > 1 ? 's' : '') + (f.kwh ? ', ' + zahl(f.kwh) + ' kWh' + (f.kw ? ', Ø ' + zahl(f.kw) + ' kW' : '') : '') : 'ohne Laden',
          f.details ? f.details.split('; ').join('\n') : '',
          f.verbrauch ? 'Verbrauch ' + zahl(f.verbrauch, 1) + ' kWh/100 km' + (f.temp !== '' && f.temp !== undefined ? ' bei ' + zahl(f.temp) + ' °C' : '') : '',
          f.stauBekannt ? '' : 'Stau unbekannt (Fahrt aus der App ohne Uhr-Aufzeichnung)',
        ].filter(Boolean);
        for (const t of zeilen) { const p = el('div', 'zeile', t); p.style.whiteSpace = 'pre-line'; mehr.append(p); }
        z.append(mehr);
        klappe.append(z);
      }
      k.append(klappe);
      $('gruppen').append(k);
    }
  </script>
</body>
</html>
