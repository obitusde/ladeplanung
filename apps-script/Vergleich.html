<!DOCTYPE html>
<!--
  Ladeplanung — Vergleichswert aus ABRP oder My CUPRA eintragen (Strecke Station X → Y, Akku Start/Ankunft).
  Wird von doGet() mit ?seite=vergleich[&route=…&richtung=…&nach=p023] ausgeliefert. Version 0.14.0
-->
<html lang="de">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --grund: #ffffff; --flaeche: #f2f2f2; --text: #000000; --leise: #3d3d3d; --linie: #c8c8c8;
      --akzent: #9a4a00; --akzent-text: #ffffff; --fehler: #7a0000; --fehler-grund: #ffe3e3; --ok-grund: #e4f4e4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --grund: #000000; --flaeche: #161616; --text: #ffffff; --leise: #c4c4c4; --linie: #3a3a3a;
        --akzent: #ffac4a; --akzent-text: #000000; --fehler: #ffc9c9; --fehler-grund: #3d0b0b; --ok-grund: #0f2a12;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--grund); color: var(--text); font: 18px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 26px; margin: 4px 0 6px; }
    h2 { font-size: 20px; margin: 22px 0 8px; }
    .leise { color: var(--leise); margin: 0 0 12px; overflow-wrap: anywhere; }
    label { display: grid; gap: 4px; margin-bottom: 14px; font-weight: 600; }
    label small { font-weight: 400; color: var(--leise); }
    input, select, textarea {
      font: inherit; color: inherit; background: var(--flaeche);
      border: 2px solid var(--linie); border-radius: 10px; padding: 10px; width: 100%; min-height: 50px;
    }
    .zwei { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
    .quelle { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .quelle button {
      min-height: 60px; border-radius: 12px; border: 2px solid var(--linie); background: var(--flaeche);
      color: var(--text); font: inherit; font-weight: 800; font-size: 20px; cursor: pointer;
    }
    .quelle button[aria-pressed="true"] { background: var(--akzent); border-color: var(--akzent); color: var(--akzent-text); }
    .knopf {
      display: flex; align-items: center; justify-content: center; width: 100%; min-height: 56px; margin-top: 10px;
      border-radius: 10px; border: 2px solid var(--linie); background: var(--flaeche); color: var(--text);
      font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; text-align: center; padding: 0 12px;
    }
    .knopf.haupt { background: var(--akzent); border-color: var(--akzent); color: var(--akzent-text); }
    .knopf:disabled { opacity: .6; }
    .hinweis { padding: 12px; border-radius: 10px; margin: 12px 0; white-space: pre-line; overflow-wrap: anywhere; }
    .hinweis.fehler { background: var(--fehler-grund); color: var(--fehler); font-weight: 600; }
    .hinweis.ok { background: var(--ok-grund); }
    ul.eingetragen { list-style: none; padding: 0; margin: 0; }
    ul.eingetragen li { padding: 8px 0; border-bottom: 1px solid var(--linie); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>Vergleichswert eintragen</h1>
    <p class="leise">Strecke in ABRP oder My CUPRA von einer Station zur nächsten planen und die beiden Akkuwerte abschreiben. Kilometer und Höhenmeter rechnet das Script selbst.</p>

    <div class="quelle" role="group" aria-label="Quelle">
      <button type="button" data-quelle="ABRP" aria-pressed="false">ABRP</button>
      <button type="button" data-quelle="My CUPRA" aria-pressed="false">My CUPRA</button>
    </div>

    <form id="form" novalidate>
      <div class="zwei">
        <label>Route <select name="route"></select></label>
        <label>Richtung <select name="richtung"><option value="hin">Hinfahrt</option><option value="rueck">Rückfahrt</option></select></label>
      </div>
      <label>Von <select name="von"></select></label>
      <label>Nach <select name="nach"></select></label>
      <div class="zwei">
        <label>Akku Start (%) <input name="start_soc" type="number" inputmode="numeric" min="0" max="100"></label>
        <label>Akku Ankunft (%) <input name="ende_soc" type="number" inputmode="numeric" min="0" max="100"></label>
      </div>
      <div class="zwei">
        <label>Fahrzeit laut App <small>optional, z. B. 2:10</small><input name="fahrzeit" inputmode="numeric" autocomplete="off" placeholder="h:mm"></label>
        <label>Temperatur (°C) <small>optional, sonst Wetter heute</small><input name="temperatur" type="number" inputmode="decimal" min="-30" max="45"></label>
      </div>
      <div id="hinweis" class="hinweis" hidden></div>
      <button id="senden" class="knopf haupt" type="submit">Speichern und weiter</button>
    </form>

    <section id="liste-bereich" hidden>
      <h2>Eingetragen</h2>
      <ul id="eingetragen" class="eingetragen"></ul>
      <div id="kalibrierung" class="hinweis ok"></div>
    </section>

    <a id="zur-app" class="knopf" href="#">Fertig – zur App</a>
    <p id="version" class="leise"></p>
  </main>

  <script>
    'use strict';
    const MODELL = <?!= modellJson ?>;
    const $ = id => document.getElementById(id);
    const form = $('form');
    const routen = MODELL.routen || [];
    const vorwahl = MODELL.vorwahl || {};

    $('zur-app').href = MODELL.appUrl;
    $('version').textContent = 'Apps Script v' + MODELL.version;

    const merke = (k, v) => { try { localStorage.setItem('ladeplanung.vergleich.' + k, v); } catch (e) { /* ohne Speicher */ } };
    const erinnere = k => { try { return localStorage.getItem('ladeplanung.vergleich.' + k); } catch (e) { return null; } };

    // Quelle: zwei große Knöpfe, zuletzt benutzte vorgewählt
    let quelle = erinnere('quelle') || '';
    function zeigeQuelle() {
      document.querySelectorAll('.quelle button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.quelle === quelle)));
    }
    document.querySelectorAll('.quelle button').forEach(b => b.addEventListener('click', () => { quelle = b.dataset.quelle; merke('quelle', quelle); zeigeQuelle(); }));
    zeigeQuelle();

    // Route und Richtung
    for (const r of routen) { const o = document.createElement('option'); o.value = r.id; o.textContent = r.name; form.route.append(o); }
    form.route.value = routen.some(r => r.id === vorwahl.route) ? vorwahl.route : (erinnere('route') || (routen[0] && routen[0].id) || '');
    if (!form.route.value && routen[0]) form.route.value = routen[0].id;
    form.richtung.value = vorwahl.route ? vorwahl.richtung : (erinnere('richtung') || 'hin');

    /** Orte in Fahrtreihenfolge: Routenanfang/-ende und die in dieser Richtung erreichbaren Stationen. */
    function orte() {
      const r = routen.find(x => x.id === form.route.value);
      if (!r) return [];
      const hin = form.richtung.value === 'hin';
      const [anfang, ende] = r.name.split(/\s+[–-]\s+/);
      const liste = r.stationen
        .filter(s => s.richtung === 'beide' || s.richtung === form.richtung.value)
        .sort((a, b) => hin ? a.km - b.km : b.km - a.km)
        .map(s => ({ id: s.id, text: s.name + ' · km ' + s.km + (s.quer_km > 1 ? ' (' + String(s.quer_km).replace('.', ',') + ' km abseits)' : '') }));
      const a = { id: 'anfang', text: (anfang || 'Anfang') + ' · km 0' };
      const e = { id: 'ende', text: (ende || 'Ende') + ' · km ' + Math.round(r.laenge_km) };
      return hin ? [a, ...liste, e] : [e, ...liste, a];
    }

    function fuelleOrte(vonWert, nachWert) {
      const liste = orte();
      for (const sel of [form.von, form.nach]) {
        sel.replaceChildren();
        for (const o of liste) { const opt = document.createElement('option'); opt.value = o.id; opt.textContent = o.text; sel.append(opt); }
      }
      const index = id => liste.findIndex(o => o.id === id);
      let n = index(nachWert);
      let v = index(vonWert);
      if (n < 0) n = Math.min(1, liste.length - 1);
      if (v < 0 || v >= n) v = Math.max(0, n - 1);
      form.von.selectedIndex = v;
      form.nach.selectedIndex = n;
    }

    form.route.addEventListener('change', () => { merke('route', form.route.value); fuelleOrte(); });
    form.richtung.addEventListener('change', () => { merke('richtung', form.richtung.value); fuelleOrte(); });
    fuelleOrte(null, vorwahl.nach);

    function hinweis(text) { const h = $('hinweis'); h.textContent = text || ''; h.className = 'hinweis fehler'; h.hidden = !text; }

    form.addEventListener('submit', ev => {
      ev.preventDefault();
      hinweis('');
      if (!quelle) { hinweis('Bitte oben die Quelle wählen: ABRP oder My CUPRA.'); return; }
      if (form.von.selectedIndex >= form.nach.selectedIndex) { hinweis('„Nach" muss in Fahrtrichtung hinter „Von" liegen.'); return; }
      if (form.start_soc.value.trim() === '' || form.ende_soc.value.trim() === '') { hinweis('Bitte Akku Start und Akku Ankunft eintragen.'); return; }

      const daten = {
        quelle, route: form.route.value, richtung: form.richtung.value, von: form.von.value, nach: form.nach.value,
        start_soc: form.start_soc.value, ende_soc: form.ende_soc.value, fahrzeit: form.fahrzeit.value, temperatur: form.temperatur.value,
      };
      $('senden').disabled = true;
      $('senden').textContent = 'Speichere … (ca. 10 Sekunden)';

      google.script.run
        .withSuccessHandler(erg => {
          $('senden').disabled = false;
          $('senden').textContent = 'Speichern und weiter';
          if (!erg || !erg.ok) { hinweis((erg && erg.fehler) || 'Unbekannter Fehler.'); return; }

          const z = erg.zeile;
          const li = document.createElement('li');
          li.textContent = z.quelle + ': ' + z.von + ' → ' + z.nach + ' · ' + z.km + ' km · ' + z.referenz + ' % (Modell bisher ' + z.modell + ' %)';
          $('eingetragen').prepend(li);
          $('kalibrierung').textContent = erg.kalibrierung + (erg.warnung ? '\n' + erg.warnung : '');
          $('liste-bereich').hidden = false;

          // weiter: „Von" = bisheriges „Nach", „Nach" = nächster Ort
          const naechsterVon = form.nach.value;
          const liste = orte();
          const i = liste.findIndex(o => o.id === naechsterVon);
          fuelleOrte(naechsterVon, liste[Math.min(i + 1, liste.length - 1)].id);
          form.start_soc.value = '';
          form.ende_soc.value = '';
          form.fahrzeit.value = '';
          form.start_soc.focus();
        })
        .withFailureHandler(e => {
          $('senden').disabled = false;
          $('senden').textContent = 'Speichern und weiter';
          hinweis('Fehler: ' + ((e && e.message) || e));
        })
        .speichereVergleich(daten);
    });
  </script>
</body>
</html>
