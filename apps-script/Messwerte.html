<!DOCTYPE html>
<!--
  Ladeplanung — Messwerte speichern. Wird von doGet() mit ?seite=messwerte&stuecke=<JSON-Liste> ausgeliefert:
  Messstücke aus der App (zwischen zwei Akkuwerten, ab 50 km) oder aus „Fahrt auswerten" (GPX, zwischen Ladestopps).
  Alle angehakten Stücke werden ins Blatt „Fahrten" geschrieben, danach wird einmal kalibriert.
  Version 0.3.0 (22.10.2026) — Fahrtenbuch auch aus „Fahrt live" der App (ohne Stau-Angabe); GPX-Auswertung derselben Fahrt ersetzt sie.
  Version 0.2.0 (18.10.2026) — Fahrtenbuch: Zusammenfassung der Fahrt (reise) anzeigen und mitspeichern.
  Version 0.1.1 (18.10.2026) — ohne „Verbrauchstempo" in der Anzeige.
  Version 0.1.0 (17.10.2026)
-->
<html lang="de">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --grund: #ffffff; --flaeche: #f2f2f2; --text: #000000; --leise: #3d3d3d; --linie: #c8c8c8;
      --akzent: #9a4a00; --akzent-text: #ffffff; --fehler: #7a0000; --fehler-grund: #ffe3e3; --ok-grund: #e4f4e4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --grund: #000000; --flaeche: #161616; --text: #ffffff; --leise: #c4c4c4; --linie: #3a3a3a;
        --akzent: #ffac4a; --akzent-text: #000000; --fehler: #ffc9c9; --fehler-grund: #3d0b0b; --ok-grund: #0f2a12;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--grund); color: var(--text); font: 17px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 24px; margin: 4px 0 6px; }
    .leise { color: var(--leise); margin: 0 0 12px; overflow-wrap: anywhere; }
    .karte { border: 1px solid var(--linie); border-radius: 10px; padding: 8px 12px; margin-bottom: 10px; }
    .karte b { display: block; }
    .karte .zeile { color: var(--leise); font-size: 15px; font-variant-numeric: tabular-nums; }
    label.wahl { display: flex; gap: 10px; align-items: center; margin-top: 6px; font-weight: 700; }
    label.wahl input { width: 24px; height: 24px; }
    label.feld { display: grid; gap: 4px; margin: 14px 0; font-weight: 600; }
    label.feld small { font-weight: 400; color: var(--leise); }
    input[type=number] {
      font: inherit; color: inherit; background: var(--flaeche);
      border: 2px solid var(--linie); border-radius: 10px; padding: 10px; width: 100%; min-height: 50px;
    }
    .knopf {
      display: flex; align-items: center; justify-content: center; width: 100%; min-height: 54px; margin-top: 10px;
      border-radius: 10px; border: 2px solid var(--linie); background: var(--flaeche); color: var(--text);
      font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; text-align: center; padding: 0 12px;
    }
    .knopf.haupt { background: var(--akzent); border-color: var(--akzent); color: var(--akzent-text); }
    .knopf:disabled { opacity: .6; }
    .hinweis { padding: 12px; border-radius: 10px; margin: 12px 0; white-space: pre-line; overflow-wrap: anywhere; }
    .hinweis.fehler { background: var(--fehler-grund); color: var(--fehler); font-weight: 600; }
    .hinweis.ok { background: var(--ok-grund); }
  </style>
  <script>
    // Auf dem Handy erscheint die Seite teils in Desktop-Breite und damit winzig (03.10.2026) → auf Gerätebreite hochskalieren
    (function () {
      var breite = window.innerWidth, geraet = screen.width;
      if (geraet && geraet < 600 && breite > geraet * 1.15) document.documentElement.style.zoom = String(Math.min(3, breite / geraet));
    })();
  </script>
</head>
<body>
  <main>
    <h1>Messwerte speichern</h1>
    <p class="leise" id="einleitung"></p>
    <div id="reise"></div>
    <div id="liste"></div>
    <label class="feld">Zusatzgewicht (kg) <small>Beifahrer, Gepäck, Dachbox – gilt für alle Stücke</small>
      <input id="zusatzgewicht" type="number" inputmode="numeric" min="0" max="1000" value="0">
    </label>
    <div id="hinweis" class="hinweis" hidden></div>
    <button id="speichern" class="knopf haupt">Speichern und kalibrieren</button>
    <a id="zur-app" class="knopf" href="#">Zur App</a>
    <p id="version" class="leise"></p>
  </main>

  <script>
    'use strict';
    const MODELL = <?!= modellJson ?>;
    const $ = id => document.getElementById(id);
    const stuecke = MODELL.stuecke || [];
    $('zur-app').href = MODELL.appUrl;
    $('version').textContent = 'Apps Script v' + MODELL.version;
    const el = (tag, klasse, text) => { const e = document.createElement(tag); if (klasse) e.className = klasse; if (text !== undefined) e.textContent = text; return e; };
    const zeit = iso => new Date(iso).toLocaleString('de-CH', { weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    const uhr = iso => new Date(iso).toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' });
    const zahl = (x, n) => Number(x).toLocaleString('de-DE', { maximumFractionDigits: n || 0 });

    const gpx = stuecke.some(s => s.quelle === 'GPX');
    $('einleitung').textContent = stuecke.length + ' Stück(e) ' + (gpx ? 'aus der Fahrt-Auswertung (GPX)' : 'aus der App (zwischen zwei Akkuwerten)') +
      '. Angehakte werden im Blatt „Fahrten" gespeichert, danach lernt das Verbrauchsmodell neu. Die Temperatur holt das Script selbst.';
    if (stuecke.length && stuecke[0].zusatzgewicht) $('zusatzgewicht').value = stuecke[0].zusatzgewicht;

    // Fahrtenbuch (Christof 18.10.2026): Zusammenfassung der Fahrt, wird mitgespeichert (Blatt „Reisen")
    const reise = MODELL.reise;
    if (reise) {
      const k = el('div', 'karte');
      const std = min => Math.floor(min / 60) + ' h ' + String(Math.round(min % 60)).padStart(2, '0');
      k.append(el('b', '', 'Fahrtenbuch · ' + zeit(reise.start) + ' · ' + zahl(reise.km) + ' km'));
      k.append(el('div', 'zeile', 'unterwegs ' + std(reise.unterwegs_min) + ' · fahren ' + std(reise.fahren_min) + ' · laden ' + std(reise.laden_min || 0) +
        (reise.stau_min === null || reise.stau_min === undefined ? '' : ' · Zeitverlust Stau ≈ ' + Math.round(reise.stau_min) + ' min')));
      if (reise.verbrauch_kwh) k.append(el('div', 'zeile', zahl(reise.verbrauch_kwh) + ' kWh · ' + zahl(reise.verbrauch_kwh / reise.verbrauch_km * 100, 1) + ' kWh/100 km'));
      k.append(el('div', 'zeile', 'Wird ins Blatt „Reisen" geschrieben (ohne Spur); dieselbe Fahrt nochmal ersetzt die Zeile' + (reise.datei && !/\.gpx$/i.test(reise.datei) ? ' – die GPX-Auswertung ersetzt sie später.' : '.')));
      $('reise').append(k);
      if (!stuecke.length) $('einleitung').textContent = 'Nur das Fahrtenbuch – für Messwerte fehlen die Akkustände.';
    }

    stuecke.forEach((s, i) => {
      const k = el('div', 'karte');
      k.append(el('b', '', (s.titel || ('Stück ' + (i + 1))) + ' · ' + zahl(s.km) + ' km'));
      k.append(el('div', 'zeile', zeit(s.start_zeit) + ' – ' + uhr(s.ende_zeit)));
      k.append(el('div', 'zeile', 'Akku ' + s.start_soc + ' → ' + s.ende_soc + ' % (' + (s.start_soc - s.ende_soc) + ' % gebraucht' +
        (s.erwartet !== undefined && s.erwartet !== null ? ', Modell bisher ≈ ' + Math.round(s.start_soc - s.erwartet) + ' %' : '') + ')'));
      k.append(el('div', 'zeile', 'Höhe +' + Math.round(s.hm_auf || 0) + ' / −' + Math.round(s.hm_ab || 0) + ' m · ' +
        (s.quelle === 'GPX' ? 'Ø ' + Math.round(s.bordcomputer_kmh) + ' km/h beim Fahren' : 'Tempo ' + Math.round(s.kmh) + ' km/h')));
      if (s.notiz) k.append(el('div', 'zeile', s.notiz));
      const l = el('label', 'wahl'), c = el('input'); c.type = 'checkbox'; c.checked = true; c.dataset.i = i;
      l.append(c, 'verwenden'); k.append(l);
      $('liste').append(k);
    });

    function zeige(text, art) { const h = $('hinweis'); h.textContent = text; h.className = 'hinweis ' + art; h.hidden = false; h.scrollIntoView({ behavior: 'smooth', block: 'center' }); }

    $('speichern').addEventListener('click', () => {
      const gewicht = $('zusatzgewicht').value.trim();
      const gewaehlt = [...document.querySelectorAll('#liste input:checked')].map(c => Object.assign({}, stuecke[Number(c.dataset.i)], { zusatzgewicht: gewicht }));
      if (!gewaehlt.length && !reise) { zeige('Nichts angehakt.', 'fehler'); return; }
      $('speichern').disabled = true;
      $('speichern').textContent = 'Wird gespeichert …';
      google.script.run
        .withSuccessHandler(erg => {
          $('speichern').textContent = 'Speichern und kalibrieren';
          if (!erg.ok) { $('speichern').disabled = false; zeige(erg.fehler, 'fehler'); return; }
          zeige('✓ ' + erg.meldung + (erg.warnung ? '\n\n⚠ ' + erg.warnung : ''), 'ok');
          $('speichern').hidden = true;
        })
        .withFailureHandler(f => { $('speichern').disabled = false; $('speichern').textContent = 'Speichern und kalibrieren'; zeige('Fehler: ' + ((f && f.message) || f), 'fehler'); })
        .speichereMesswerte(gewaehlt, reise || null);
    });
  </script>
</body>
</html>
