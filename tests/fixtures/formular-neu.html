<!DOCTYPE html>
<!--
  Ladeplanung — Formular zum Bearbeiten und Hinzufügen eines Ladepunkts.
  Wird von doGet() in Code.js ausgeliefert; MODELL kommt aus dem Template.
  Version 0.11.0
-->
<html lang="de">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
  // Nachbau von google.script.run: neu → erst Dublette, mit „trotzdem" Erfolg; bearbeiten → Erfolg
  window.__aufrufe = [];
  window.google = { script: { get run() {
    const r = { ok: null, fehler: null,
      withSuccessHandler(f) { this.ok = f; return this; },
      withFailureHandler(f) { this.fehler = f; return this; },
      speicherePunkt(d) { __aufrufe.push(['speicherePunkt', d]); setTimeout(() => this.ok({ ok: true, meldung: 'Gespeichert: Richtung, Notiz.', warnung: '',
        punkt: { id: 'p023', name: 'EnBW Ladestation Lorsch', zuordnung: [{ route: 'Morges – Neuenrade', km: 468, quer_km: 4.2, strasse: 'A 5', raststaette: false }] } }), 200); },
      legePunktAn(d) { __aufrufe.push(['legePunktAn', d]); setTimeout(() => this.ok(d.trotzdem
        ? { ok: true, meldung: 'Angelegt als p048: EnBW Ladestation Haiger.', warnung: '', punkt: { id: 'p048', name: 'EnBW Ladestation Haiger', zuordnung: [{ route: 'Morges – Neuenrade', km: 626, quer_km: 0.2, strasse: 'A 45', raststaette: true }] } }
        : { ok: false, dublette: { id: 'p010', name: 'EnBW Ladestation Haiger', abstand_m: 12 } }), 200); },
    };
    return r;
  } } };
</script>
  <meta charset="utf-8">
  <style>
    :root {
      --grund: #ffffff; --flaeche: #f2f2f2; --text: #000000; --leise: #3d3d3d; --linie: #c8c8c8;
      --akzent: #9a4a00; --akzent-text: #ffffff; --fehler: #7a0000; --fehler-grund: #ffe3e3; --ok-grund: #e4f4e4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --grund: #000000; --flaeche: #161616; --text: #ffffff; --leise: #c4c4c4; --linie: #3a3a3a;
        --akzent: #ffac4a; --akzent-text: #000000; --fehler: #ffc9c9; --fehler-grund: #3d0b0b; --ok-grund: #0f2a12;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--grund); color: var(--text); font: 18px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 26px; margin: 4px 0 6px; }
    .leise { color: var(--leise); margin: 0 0 16px; overflow-wrap: anywhere; }
    label { display: grid; gap: 4px; margin-bottom: 14px; font-weight: 600; }
    input, select, textarea {
      font: inherit; color: inherit; background: var(--flaeche);
      border: 2px solid var(--linie); border-radius: 10px; padding: 10px; width: 100%; min-height: 50px;
    }
    textarea { resize: vertical; }
    .zwei { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
    label.schalter { display: flex; align-items: center; gap: 10px; }
    label.schalter input { width: 28px; height: 28px; min-height: 0; }
    .knopf {
      display: flex; align-items: center; justify-content: center; width: 100%; min-height: 56px; margin-top: 10px;
      border-radius: 10px; border: 2px solid var(--linie); background: var(--flaeche); color: var(--text);
      font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; text-align: center; padding: 0 12px;
    }
    .knopf.haupt { background: var(--akzent); border-color: var(--akzent); color: var(--akzent-text); }
    .knopf:disabled { opacity: .6; }
    .hinweis { padding: 12px; border-radius: 10px; margin: 12px 0; white-space: pre-line; overflow-wrap: anywhere; }
    .hinweis.fehler { background: var(--fehler-grund); color: var(--fehler); font-weight: 600; }
    .hinweis.ok { background: var(--ok-grund); }
  </style>
</head>
<body>
  <main>
    <h1 id="titel"></h1>
    <p id="unter" class="leise"></p>
    <div id="hinweis" class="hinweis" hidden></div>

    <form id="form" novalidate>
      <label id="feld-link" hidden>Google-Maps-Link
        <input name="link" type="url" inputmode="url" autocomplete="off" placeholder="https://maps.app.goo.gl/…">
      </label>
      <label>Name <input name="Name" autocomplete="off"></label>
      <label>Betreiber <input name="Betreiber" autocomplete="off"></label>
      <div class="zwei">
        <label>Leistung (kW) <input name="kW" type="number" inputmode="numeric" min="1" max="1000"></label>
        <label>Ladepunkte <input name="Anzahl" type="number" inputmode="numeric" min="1" max="99"></label>
      </div>
      <label>Erreichbar
        <select name="Richtung">
          <option value="beide">in beide Richtungen</option>
          <option value="hin">nur Hinfahrt (ab Morges)</option>
          <option value="rueck">nur Rückfahrt (nach Morges)</option>
        </select>
      </label>
      <label class="schalter"><input type="checkbox" name="Favorit"> Favorit</label>
      <label>Notiz <textarea name="Notiz" rows="3" placeholder="z. B. Coop, McDonald's, Raststätte"></textarea></label>

      <button id="senden" class="knopf haupt" type="submit"></button>
      <button id="trotzdem" class="knopf" type="button" hidden>Trotzdem als neue Station anlegen</button>
      <a id="bestehende" class="knopf" href="#" hidden>Bestehende Station bearbeiten</a>
      <a id="abbrechen" class="knopf" href="#">Abbrechen – zur App</a>
    </form>

    <section id="fertig" hidden>
      <div id="fertig-text" class="hinweis ok"></div>
      <div id="fertig-warnung" class="hinweis fehler" hidden></div>
      <a id="zur-app" class="knopf haupt" href="#">Fertig – zur App</a>
      <a id="noch-eine" class="knopf" href="#">Weitere Station hinzufügen</a>
    </section>

    <p id="version" class="leise"></p>
  </main>

  <script>
    'use strict';
    const MODELL = {"modus":"neu","appUrl":"https://obitusde.github.io/ladeplanung/","formularUrl":"https://script.google.com/macros/s/TEST/exec","version":"0.11.0","punkt":{"link":"","Richtung":"beide"}};

    const $ = id => document.getElementById(id);
    const form = $('form');
    const neu = MODELL.modus === 'neu';
    const punkt = MODELL.punkt || {};
    const knopfText = neu ? 'Anlegen' : 'Speichern';

    $('titel').textContent = neu ? 'Ladepunkt hinzufügen' : 'Ladepunkt bearbeiten';
    $('unter').textContent = neu
      ? 'Link aus Google Maps einfügen (Ort antippen → „Teilen" → „Link kopieren"). Alles andere ist optional – Name, Adresse und Betreiber ergänzt das Script.'
      : [punkt.id, punkt.Adresse].filter(Boolean).join(' · ');
    $('feld-link').hidden = !neu;
    $('senden').textContent = knopfText;
    $('abbrechen').href = MODELL.appUrl;
    $('zur-app').href = MODELL.appUrl;
    $('noch-eine').href = MODELL.formularUrl + '?neu=1';
    $('version').textContent = 'Apps Script v' + MODELL.version;
    if (neu) {
      form.Name.placeholder = 'leer = aus dem Link';
      form.Betreiber.placeholder = 'leer = aus dem Namen';
    }

    for (const feld of ['link', 'Name', 'Betreiber', 'kW', 'Anzahl', 'Notiz']) {
      if (form[feld] && punkt[feld] !== undefined && punkt[feld] !== null) form[feld].value = punkt[feld];
    }
    form.Richtung.value = punkt.Richtung || 'beide';
    form.Favorit.checked = punkt.Favorit === true;

    function hinweis(text, art) {
      const h = $('hinweis');
      h.textContent = text || '';
      h.className = 'hinweis ' + (art || '');
      h.hidden = !text;
      if (text) h.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function beschaeftigt(an) {
      $('senden').disabled = an;
      $('trotzdem').disabled = an;
      $('senden').textContent = an ? 'Speichere … (ca. 15 Sekunden)' : knopfText;
    }

    function formularDaten(trotzdem) {
      return {
        id: punkt.id, link: form.link.value.trim(), Name: form.Name.value, Betreiber: form.Betreiber.value,
        kW: form.kW.value, Anzahl: form.Anzahl.value, Richtung: form.Richtung.value,
        Favorit: form.Favorit.checked, Notiz: form.Notiz.value, trotzdem: !!trotzdem,
      };
    }

    function zuordnungText(p) {
      if (!p) return '';
      if (!p.zuordnung || p.zuordnung.length === 0) return 'Keiner Route zugeordnet – mehr als 10 km von allen Routen entfernt.';
      return 'Erscheint in der App bei:\n' + p.zuordnung.map(z =>
        '• ' + z.route + ', km ' + z.km +
        (z.strasse ? ', ' + z.strasse : '') +
        (z.quer_km > 1 ? ', ' + String(z.quer_km).replace('.', ',') + ' km abseits' : z.raststaette ? ', Raststätte' : '')
      ).join('\n');
    }

    function ergebnis(erg) {
      beschaeftigt(false);
      if (erg && erg.dublette) {
        hinweis('Diese Station gibt es schon: ' + erg.dublette.id + ' ' + erg.dublette.name +
          ' (' + erg.dublette.abstand_m + ' m entfernt).', 'fehler');
        $('trotzdem').hidden = false;
        $('bestehende').href = MODELL.formularUrl + '?id=' + encodeURIComponent(erg.dublette.id);
        $('bestehende').hidden = false;
        return;
      }
      if (!erg || !erg.ok) {
        hinweis((erg && erg.fehler) || 'Unbekannter Fehler.', 'fehler');
        return;
      }
      form.hidden = true;
      hinweis('');
      $('fertig-text').textContent = [
        erg.meldung,
        zuordnungText(erg.punkt),
        'Die App zeigt die Änderung nach etwa 1–2 Minuten.',
      ].filter(Boolean).join('\n\n');
      $('fertig-warnung').textContent = erg.warnung || '';
      $('fertig-warnung').hidden = !erg.warnung;
      $('fertig').hidden = false;
      window.scrollTo(0, 0);
    }

    function senden(trotzdem) {
      hinweis('');
      if (neu && !form.link.value.trim()) {
        hinweis('Bitte zuerst den Google-Maps-Link einfügen.', 'fehler');
        form.link.focus();
        return;
      }
      beschaeftigt(true);
      const lauf = google.script.run
        .withSuccessHandler(ergebnis)
        .withFailureHandler(f => { beschaeftigt(false); hinweis('Fehler: ' + ((f && f.message) || f), 'fehler'); });
      if (neu) lauf.legePunktAn(formularDaten(trotzdem));
      else lauf.speicherePunkt(formularDaten(false));
    }

    form.addEventListener('submit', ev => { ev.preventDefault(); senden(false); });
    $('trotzdem').addEventListener('click', () => {
      $('trotzdem').hidden = true;
      $('bestehende').hidden = true;
      senden(true);
    });
  </script>
</body>
</html>
