<body>
  <main>
    <h1>Vergleichswert eintragen</h1>
    <p class="leise">Strecke in ABRP oder My CUPRA von einer Station zur nächsten planen und die beiden Akkuwerte abschreiben. Kilometer und Höhenmeter rechnet das Script selbst.</p>

    <div class="quelle" role="group" aria-label="Quelle">
      <button type="button" data-quelle="ABRP" aria-pressed="false">ABRP</button>
      <button type="button" data-quelle="My CUPRA" aria-pressed="false">My CUPRA</button>
    </div>

    <form id="form" novalidate>
      <div class="zwei">
        <label>Route <select name="route"></select></label>
        <label>Richtung <select name="richtung"><option value="hin">Hinfahrt</option><option value="rueck">Rückfahrt</option></select></label>

      <label>Von <select name="von"></select></label>
      <label>Nach <select name="nach"></select></label>
      <div class="zwei">
        <label>Akku Start (%) <input name="start_soc" type="number" inputmode="numeric" min="0" max="100"></label>
        <label>Akku Ankunft (%) <input name="ende_soc" type="number" inputmode="numeric" min="0" max="100"></label>
      </div>
      <div class="zwei">
        <label>Fahrzeit laut App <small>optional, z. B. 2:10</small><input name="fahrzeit" inputmode="numeric" autocomplete="off" placeholder="h:mm"></label>
        <label>Temperatur (°C) <small>optional, sonst Wetter heute</small><input name="temperatur" type="number" inputmode="decimal" min="-30" max="45"></label>
      </div>
      <div id="hinweis" class="hinweis" hidden></div>
      <button id="senden" class="knopf haupt" type="submit">Speichern und weiter</button>
    </form>

    <section id="liste-bereich" hidden>
      <h2>Eingetragen</h2>
      <ul id="eingetragen" class="eingetragen"></ul>
      <div id="kalibrierung" class="hinweis ok"></div>
    </section>

    <a id="zur-app" class="knopf" href="#">Fertig – zur App</a>
    <p id="version" class="leise"></p>
  </main>

de","quer_km":2.1},{"id":"p031","name":"EnBW Ehringshausen","km":600,"richtung":"rueck","quer_km":0.1},{"id":"p033","name":"EnBW Siegen","km":648,"richtung":"hin","quer_km":0.1},{"id":"p036","name":"EnBW Appenweier","km":330,"richtung":"hin","quer_km":0.1},{"id":"p037","name":"EnBW Hockenheim","km":431,"richtung":"hin","quer_km":3.9},{"id":"p038","name":"EnBW Pfungstadt","km":486,"richtung":"hin","quer_km":3.5},{"id":"p039","name":"EnBW Sandhausen","km":435,"richtung":"hin","quer_km":0.1},{"id":"p040","name":"EnBW Mahlberg","km":297,"richtung":"hin","quer_km":0.1},{"id":"p041","name":"EnBW Weil am Rhein","km":205,"richtung":"hin","quer_km":0},{"id":"p042","name":"EnBW Bühl","km":355,"richtung":"hin","quer_km":0.1},{"id":"p043","name":"EnBW Herborn","km":611,"richtung":"hin","quer_km":0.1}]},{"id":"ingolstadt","name":"Morges – Ingolstadt","laenge_km":620.65,"stationen":[{"id":"p001","name":"AMAG Lausanne","km":8,"richtung":"beide","quer_km":4.1},{"id":"p002","name":"AMAG Baden Fislisbach","km":207,"richtung":"beide","quer_km":1.7},{"id":"p004","name":"AMAG Winterthur","km":247,"richtung":"beide","quer_km":0.1},{"id":"p006","name":"AMAG Bern","km":110,"richtung":"beide","quer_km":0.5},{"id":"p007","name":"Amag Zuchwil","km":140,"richtung":"beide","quer_km":2.2},{"id":"p008","name":"AMAG Oftringen","km":170,"richtung":"beide","quer_km":0.4},{"id":"p009","name":"Porsche Sales & Marketplace Winterthur","km":246,"richtung":"beide","quer_km":0.1},{"id":"p022","name":"AMAG Crissier","km":8,"richtung":"beide","quer_km":0.2},{"id":"p048","name":"EnBW Kißlegg","km":393,"richtung":"beide","quer_km":0.1},{"id":"p049","name":"EWE Go Lindau (Bodensee)","km":367,"richtung":"beide","quer_km":0.5}]},{"id":"savona_simplon","name":"Morges – Savona (Simplon)","laenge_km":478.22,"stationen":[{"id":"p001","name":"AMAG Lausanne","km":17,"richtung":"beide","quer_km":2.8},{"id":"p022","name":"AMAG Crissier","km":8,"richtung":"beide","quer_km":0.2},{"id":"p044","name":"Tesla Supercharger","km     const $ = id => document.getElementById(id);
    const form = $('form');
    const routen = MODELL.routen || [];
    const vorwahl = MODELL.vorwahl || {};

    $('zur-app').href = MODELL.appUrl;
    $('version').textContent = 'Apps Script v' + MODELL.version;

    const merke = (k, v) => { try { localStorage.setItem('ladeplanung.vergleich.' + k, v); } catch (e) { /* ohne Speicher */ } };
    const erinnere = k => { try { return localStorage.getItem('ladeplanung.vergleich.' + k); } catch (e) { return null; } };

    // Quelle: zwei große Knöpfe, zuletzt benutzte vorgewählt
    let quelle = erinnere('quelle') || '';
    function zeigeQuelle() {
      document.querySelectorAll('.quelle button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.quelle === quelle)));
    }
    document.querySelectorAll('.quelle button').forEach(b => b.addEventListener('click', () => { quelle = b.dataset.quelle; merke('quelle', quelle); zeigeQuelle(); }));
    zeigeQuelle();

    // Route und Richtung
    for (const r of routen) { const o = document.createElement('option'); o.value = r.id; o.textContent = r.name; form.route.append(o); }
    form.route.value = routen.some(r => r.id === vorwahl.route) ? vorwahl.route : (erinnere('route') || (routen[0] && routen[0].id) || '');
    if (!form.route.value && routen[0]) form.route.value = routen[0].id;
    form.richtung.value = vorwahl.route ? vorwahl.richtung : (erinnere('richtung') || 'hin');

    /** Orte in Fahrtreihenfolge: Routenanfang/-ende und die in dieser Richtung erreichbaren Stationen. */
    function orte() {
      const r = routen.find(x => x.id === form.route.value);
      if (!r) return [];
      const hin = form.richtung.value === 'hin';
      const [anfang, ende] = r.name.split(/\s+[–-]\s+/);
      const liste = r.stationen
        .filter(s => s.richtung === 'beide' || s.richtung === form.richtung.value)
        .sort((a, b) => hin ? a.km - b.km : b.km - a.km)
        .map(s => ({ id: s.id, text: s.name + ' · km ' + s.km + (s.quer_km > 1 ? ' (' + String(s.quer_km).replace('.', ',') + ' km abseits)' : '') }));

      const e = { id: 'ende', text: (ende || 'Ende') + ' · km ' + Math.round(r.laenge_km) };
      return hin ? [a, ...liste, e] : [e, ...liste, a];
    }

    function fuelleOrte(vonWert, nachWert) {
      const liste = orte();
      for (const sel of [form.von, form.nach]) {
        sel.replaceChildren();
        for (const o of liste) { const opt = document.createElement('option'); opt.value = o.id; opt.textContent = o.text; sel.append(opt); }
      }
      const index = id => liste.findIndex(o => o.id === id);
      let n = index(nachWert);
      let v = index(vonWert);

      form.von.selectedIndex = v;
      form.nach.selectedIndex = n;

          $('senden').disabled = false;
          $('senden').textContent = 'Speichern und weiter';

          const z = erg.zeile;
          const li = document.createElement('li');
          li.textContent = z.quelle + ': ' + z.von + ' → ' + z.nach + ' · ' + z.km + ' km · ' + z.referenz + ' % (Modell bisher ' + z.modell + ' %)';
          $('eingetragen').prepend(li);
          $('kalibrierung').textContent = erg.kalibrierung + (erg.warnung ? '\n' + erg.warnung : '');
          $('liste-bereich').hidden = false;

          // weiter: „Von" = bisheriges „Nach", „Nach" = nächster Ort
          const naechsterVon = form.nach.value;
          const liste = orte();
          const i = liste.findIndex(o => o.id === naechsterVon);
          fuelleOrte(naechsterVon, liste[Math.min(i + 1, liste.length - 1)].id);
          form.start_soc.value = '';
          form.ende_soc.value = '';
          form.fahrzeit.value = '';
          form.start_soc.focus();
        })
        .withFailureHandler(e => {
          $('senden').disabled = false;
          $('senden').textContent = 'Speichern und weiter';
          hinweis('Fehler: ' + ((e && e.message) || e));
        })
        .speichereVergleich(daten);
    });
  </script>
